[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    asyncio: marca testes como assincronos
    auth: testes de autenticação
    items: testes de gerenciamento de itens
    reviews: testes de avaliações
    reports: testes de denúncias
    admin: testes de painel administrativo
    permissions: testes de permissões e autorização

